<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Flight Price Tracker</title>
<meta name="description" content="Track Kerala to UAE flight fares from your daily WhatsApp price list." />
<meta name="theme-color" content="#0F1720" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="./react.production.min.js"></script>
<script src="./react-dom.production.min.js"></script>

<style>
  html, body { background: #0F1720; margin: 0; }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { -webkit-font-smoothing: antialiased; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #26374A; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="./app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
